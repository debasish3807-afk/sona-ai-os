[project]
name = "sona-ai-kernel"
version = "1.0.0"
description = "AI Kernel - Central intelligence engine for Sona AI OS"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "sona-shared-kernel",
    "sona-llm-client",
    "sona-event-bus",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sona_ai_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


[tool.mypy]
python_version = "3.12"
strict = true
