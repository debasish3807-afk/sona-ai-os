[project]
name = "sona-ai-os"
version = "1.0.0-rc1"
description = "Sona AI OS - Next-Generation Personal AI Operating System (Monorepo)"
requires-python = ">=3.12"
license = "MIT"

[tool.uv.workspace]
members = [
    "services/ai-kernel",
    "services/thalamus-router",
    "services/brain-os",
    "services/memory-os",
    "services/knowledge-os",
    "services/workforce-os",
    "services/workflow-engine",
    "services/mcp-integration",
    "services/research-os",
    "services/ai-engineering-os",
    "services/evaluation-os",
    "services/security",
    "services/observability",
    "services/plugin-system",
    "libs/shared-kernel",
    "libs/llm-client",
    "libs/event-bus",
    "gateway",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services", "libs", "gateway"]

[tool.ruff.lint]
select = [

    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "T20",   # flake8-print
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "RET",   # flake8-return
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "COM812",  # missing trailing comma (conflicts with formatter)
    "ARG001",  # unused function argument (common in abstract/interface methods)
    "ARG002",  # unused method argument (common in abstract/interface methods)
    "B008",    # function call in default argument (FastAPI Depends pattern)
    "RET504",  # unnecessary assignment before return
    "A001",    # builtin-variable-shadowing (intentional in domain models)
    "A002",    # builtin-argument-shadowing (intentional in domain models)
    "A004",    # builtin-import-shadowing (intentional aliasing)
    "N818",    # error-suffix-on-exception-name (project uses Error suffix convention)
    "B027",    # empty-method-without-abstract-decorator (hook methods)
    "SIM105",  # contextlib.suppress pattern
    "SIM102",  # nested if (readability preference)
    "SIM103",  # return condition directly (readability preference)
    "SIM108",  # ternary (readability in complex conditions)
    "UP046",  # Allow Generic subclass style for library compatibility
]

[tool.ruff.lint.isort]
known-first-party = [
    "sona_shared",
    "sona_llm",
    "sona_events",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests/", "__pycache__/", "backend/"]

[tool.pytest.ini_options]
testpaths = [
    "services",
    "libs",
    "gateway/tests",
]
asyncio_mode = "auto"
importmode = "importlib"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -v"

[tool.coverage.run]
source = ["services", "libs", "gateway"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 50

[tool.ruff.lint.per-file-ignores]
"libs/shared-kernel/sona_shared/domain/primitives.py" = ["UP046"]
