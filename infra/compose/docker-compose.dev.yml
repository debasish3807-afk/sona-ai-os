# Sona AI OS - Development Overrides
# Usage: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.dev.yml up

services:
  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.gateway
      target: builder
    volumes:
      - ../../gateway/app:/app/app:ro
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - DEBUG=true
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"
