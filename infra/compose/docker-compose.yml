# Sona AI OS - Full Stack Docker Compose
# This file defines the complete service infrastructure.
# Usage: docker compose -f infra/compose/docker-compose.yml up

services:
  # ---- API Gateway ----
  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.gateway
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=local
      - LOG_LEVEL=info
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=sona_db
      - DATABASE_USER=sona
      - DATABASE_PASSWORD=${DB_PASSWORD:-sona_dev_pass}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - sona-network
    restart: unless-stopped

  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sona_db
      POSTGRES_USER: sona
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sona_dev_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sona -d sona_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sona-network
    restart: unless-stopped

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sona-network
    restart: unless-stopped

  # ---- Qdrant Vector Database ----
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - sona-network
    restart: unless-stopped

  # ---- Nginx Reverse Proxy ----
  nginx:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - gateway
    networks:
      - sona-network
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  qdrantdata:
    driver: local

networks:
  sona-network:
    driver: bridge
