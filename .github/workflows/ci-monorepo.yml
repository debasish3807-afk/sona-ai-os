name: CI Monorepo Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      android: ${{ steps.changes.outputs.android }}
      infra: ${{ steps.changes.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'services/**'
              - 'libs/**'
              - 'gateway/**'
            frontend:
              - 'apps/web/**'
            android:
              - 'apps/android/**'
            infra:
              - 'infra/**'

  backend-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linting tools
        run: pip install ruff
      - name: Run ruff check
        run: ruff check services/ libs/ gateway/
      - name: Run ruff format check
        run: ruff format --check services/ libs/ gateway/

  backend-test:
    needs: [detect-changes, backend-lint]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sona
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: sona_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sona"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shared libraries
        run: |
          pip install -e libs/shared-kernel[dev]
          pip install -e libs/llm-client[dev]
          pip install -e libs/event-bus[dev]
      - name: Install all services
        run: |
          for service in services/*/; do
            if [ -f "$service/pyproject.toml" ]; then
              pip install -e "$service[dev]"
            fi
          done
      - name: Install gateway
        run: pip install -e gateway[dev]
      - name: Run tests with coverage
        run: pytest --cov --cov-report=xml -v
        env:
          DATABASE_URL: postgresql://sona:test_password@localhost:5432/sona_test
          REDIS_URL: redis://localhost:6379/0

  frontend-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web
      - name: Lint
        run: npm run lint
        working-directory: apps/web
      - name: Test
        run: npm run test:run
        working-directory: apps/web
      - name: Build
        run: npm run build
        working-directory: apps/web

  android-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run lint
        run: ./gradlew lint
        working-directory: apps/android
      - name: Run tests
        run: ./gradlew test
        working-directory: apps/android
