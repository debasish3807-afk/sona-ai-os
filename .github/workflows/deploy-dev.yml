# =============================================================================
# Sona AI OS — Development Deployment Pipeline
# =============================================================================
# Triggers: Push to develop branch (monorepo changes)
# Gate:     Requires CI Monorepo Pipeline to pass first
# Target:   Development environment
# =============================================================================

name: Deploy Development

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  DEPLOY_ENV: development
  APP_NAME: sona-ai-os
  IMAGE_TAG: dev-${{ github.sha }}

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Gate: Verify CI Monorepo Pipeline passed on this commit
  # ===========================================================================
  ci-gate:
    name: "CI Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI Monorepo Pipeline
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'backend-test'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success

      - name: Gate passed
        run: echo "✅ CI Monorepo Pipeline passed — safe to deploy"

  # ===========================================================================
  # Build: Create deployment artifact
  # ===========================================================================
  build:
    name: "Build Artifact"
    runs-on: ubuntu-latest
    needs: ci-gate
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate build metadata
        id: meta
        run: |
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create deployment package
        run: |
          mkdir -p dist
          # Package monorepo services
          for service in services/*/; do
            if [ -f "$service/pyproject.toml" ]; then
              svc_name=$(basename "$service")
              cp -r "$service" "dist/$svc_name/"
              find "dist/$svc_name/" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
              rm -rf "dist/$svc_name/tests"
            fi
          done
          # Package gateway
          cp -r gateway/ dist/gateway/
          find dist/gateway/ -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          rm -rf dist/gateway/tests
          # Package shared libs
          cp -r libs/ dist/libs/
          find dist/libs/ -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find dist/libs/ -path "*/tests" -type d -exec rm -rf {} + 2>/dev/null || true
          # Build info
          echo "{
            \"app\": \"${{ env.APP_NAME }}\",
            \"version\": \"dev\",
            \"commit\": \"${{ github.sha }}\",
            \"branch\": \"${{ github.ref_name }}\",
            \"build_time\": \"${{ steps.meta.outputs.build_time }}\",
            \"environment\": \"${{ env.DEPLOY_ENV }}\"
          }" > dist/build-info.json
          cat dist/build-info.json

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package-dev
          path: dist/
          retention-days: 7

  # ===========================================================================
  # Deploy: Push to development environment
  # ===========================================================================
  deploy:
    name: "Deploy to Development"
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: development
      url: https://dev.sona-ai.example.com
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package-dev
          path: dist/

      - name: Display deployment info
        run: |
          echo "============================================"
          echo "  DEPLOYMENT: Development Environment"
          echo "============================================"
          echo "  App:         ${{ env.APP_NAME }}"
          echo "  Environment: ${{ env.DEPLOY_ENV }}"
          echo "  Branch:      ${{ github.ref_name }}"
          echo "  Commit:      ${{ github.sha }}"
          echo "  Triggered:   ${{ github.event_name }}"
          echo "  Actor:       ${{ github.actor }}"
          echo "============================================"
          cat dist/build-info.json

      - name: Deployment placeholder
        run: |
          echo "✅ Development deployment successful (placeholder)"
          echo "   Configure actual deployment target (K8s, ECS, etc.) in this step"

  # ===========================================================================
  # Verify: Post-deployment health check
  # ===========================================================================
  verify:
    name: "Verify Deployment"
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check
        run: |
          echo "Running post-deployment health checks..."
          # Replace with actual health endpoint:
          # curl -f https://dev.sona-ai.example.com/health || exit 1
          echo "✅ Health check passed (placeholder)"

      - name: Deployment summary
        run: |
          echo "## 🚀 Development Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Development |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
