name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 0.2.0-beta)'
        required: false
        default: '0.2.0-beta'
      signed:
        description: 'Sign APK (requires secrets)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: apps/android

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7
        working-directory: apps/android

      - name: Validate signing secrets
        if: inputs.signed == 'true'
        run: |
          MISSING=""
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            MISSING="${MISSING} ANDROID_KEYSTORE_BASE64"
          fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then
            MISSING="${MISSING} ANDROID_KEYSTORE_PASSWORD"
          fi
          if [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            MISSING="${MISSING} ANDROID_KEY_ALIAS"
          fi
          if [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            MISSING="${MISSING} ANDROID_KEY_PASSWORD"
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required signing secrets:${MISSING}"
            echo "All 4 signing secrets must be configured: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            exit 1
          fi
          echo "All signing secrets are configured."

      - name: Run lint
        run: ./gradlew lint --no-daemon
        working-directory: apps/android

      - name: Run unit tests
        run: ./gradlew test --no-daemon
        working-directory: apps/android

      - name: Decode signing keystore
        if: inputs.signed == 'true'
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/release-signing.keystore"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to decode keystore - file is empty"
            exit 1
          fi
          echo "ANDROID_KEYSTORE_FILE=${KEYSTORE_PATH}" >> $GITHUB_ENV
          echo "Keystore decoded to temporary path."

      - name: Build Release APK (signed)
        if: inputs.signed == 'true'
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Release APK (unsigned)
        if: inputs.signed != 'true'
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: apps/android

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find apps/android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found!"
            find apps/android/app/build/outputs/ -name "*.apk" 2>/dev/null
            exit 1
          fi
          echo "APK found: $APK_PATH"
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          ls -la "$APK_PATH"

      - name: Verify APK signature
        run: |
          APK_PATH="${{ steps.apk.outputs.path }}"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          echo "=== APK Signature Verification ==="
          if "$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1; then
            CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1)
            CERT_DN=$(echo "$CERT_INFO" | grep "certificate DN" | head -1)
            CERT_SHA256=$(echo "$CERT_INFO" | grep "certificate SHA-256" | head -1 | awk '{print $NF}')
            echo "CERT_SHA256=${CERT_SHA256}" >> $GITHUB_ENV
            echo "Certificate DN: ${CERT_DN}"
            echo "Certificate SHA-256: ${CERT_SHA256}"
            # Detect debug certificate - reject for production builds
            if echo "$CERT_DN" | grep -q "CN=Android Debug"; then
              echo "::warning::APK is signed with DEBUG certificate"
              if [ "${{ inputs.signed }}" == "true" ]; then
                echo "::error::APK is signed with debug certificate but signed=true was requested. Production keystore was not applied correctly."
                exit 1
              fi
              echo "SIGNING_STATUS=debug-signed" >> $GITHUB_ENV
            else
              echo "SIGNING_STATUS=signed" >> $GITHUB_ENV
            fi
          else
            echo "SIGNING_STATUS=unsigned" >> $GITHUB_ENV
            echo "CERT_SHA256=N/A" >> $GITHUB_ENV
            echo "APK is unsigned."
            if [ "${{ inputs.signed }}" == "true" ]; then
              echo "::error::APK is unsigned but signed=true was requested!"
              exit 1
            fi
          fi

      - name: Verify APK metadata
        run: |
          APK_PATH="${{ steps.apk.outputs.path }}"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using aapt2: $AAPT2"
          echo "=== APK Metadata (aapt2 dump badging) ==="
          "$AAPT2" dump badging "$APK_PATH"

      - name: Generate APK SHA-256 hash
        id: hash
        run: |
          APK_PATH="${{ steps.apk.outputs.path }}"
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "sha256=${APK_SHA256}" >> $GITHUB_OUTPUT
          echo "APK SHA-256: ${APK_SHA256}"

      - name: Get build metadata
        id: metadata
        run: |
          echo "commit_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "version=${{ inputs.version_name || '0.2.0-beta' }}" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Rename and prepare APK artifact
        run: |
          APK_PATH="${{ steps.apk.outputs.path }}"
          if [ "${{ env.SIGNING_STATUS }}" == "signed" ]; then
            LABEL="release"
          elif [ "${{ env.SIGNING_STATUS }}" == "debug-signed" ]; then
            LABEL="unsigned-debug"
          else
            LABEL="unsigned-debug"
          fi
          FINAL_NAME="sona-ai-os-${{ steps.metadata.outputs.version }}-${LABEL}-${{ steps.metadata.outputs.commit_sha }}.apk"
          cp "$APK_PATH" "apps/android/$FINAL_NAME"
          echo "FINAL_APK=apps/android/$FINAL_NAME" >> $GITHUB_ENV
          echo "ARTIFACT_LABEL=${LABEL}" >> $GITHUB_ENV
          echo "Renamed to: $FINAL_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sona-ai-os-${{ steps.metadata.outputs.version }}-${{ env.ARTIFACT_LABEL }}
          path: ${{ env.FINAL_APK }}
          retention-days: 90
          if-no-files-found: error

      - name: Cleanup signing materials
        if: always() && inputs.signed == 'true'
        run: |
          if [ -f "${RUNNER_TEMP}/release-signing.keystore" ]; then
            rm -f "${RUNNER_TEMP}/release-signing.keystore"
            echo "Signing keystore cleaned up."
          fi

      - name: Build summary
        run: |
          APK_SIZE=$(du -h "${{ env.FINAL_APK }}" | awk '{print $1}')
          echo "## Android Release Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.metadata.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ steps.metadata.outputs.commit_sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Date | ${{ steps.metadata.outputs.date }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | com.sona.ai |" >> $GITHUB_STEP_SUMMARY
          echo "| Variant | release |" >> $GITHUB_STEP_SUMMARY
          echo "| Signed | ${{ env.SIGNING_STATUS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Certificate SHA-256 | ${{ env.CERT_SHA256 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| APK SHA-256 | ${{ steps.hash.outputs.sha256 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| APK Size | ${APK_SIZE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | sona-ai-os-${{ steps.metadata.outputs.version }}-${{ env.ARTIFACT_LABEL }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.SIGNING_STATUS }}" != "signed" ]; then
            echo "> **Warning:** This APK is unsigned. It will be blocked by Google Play Protect on real devices." >> $GITHUB_STEP_SUMMARY
            echo "> Configure signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) and run with signed=true for a production build." >> $GITHUB_STEP_SUMMARY
          fi
