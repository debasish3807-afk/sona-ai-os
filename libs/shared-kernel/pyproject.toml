[project]
name = "sona-shared-kernel"
version = "1.0.0"
description = "Sona AI OS Shared Kernel - Domain primitives, value objects, and common interfaces"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sona_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


[tool.mypy]
python_version = "3.12"
strict = true
